name: 'Business SDK'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: 'Verify SDK & OpenAPI artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Business SDK
        run: bun run lint && bun run format:check && bun run check-generated && bun run typecheck && bun run test

      - name: Build publishable package
        run: bun run build

      - name: Pack npm-compatible artifact
        run: |
          mkdir -p test/results
          bun pm pack --ignore-scripts --filename "$PWD/test/results/orvelt-business.tgz"

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test the packed SDK
        run: bun run test-e2e

      - name: Save the verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-sdk-package
          path: test/results/orvelt-business.tgz
          if-no-files-found: error

      - name: Save browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-sdk-verification
          path: |
            test/results/playwright
            test/report

  publish:
    name: 'Publish @orvelt/business to npm'
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require the standalone main branch
        run: test "$GITHUB_REF" = refs/heads/main

      # Publish the exact tarball that passed verification, without rebuilding it.
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: business-sdk-package
          path: test/results

      - name: Inspect package contents
        run: npm pack ./test/results/orvelt-business.tgz --dry-run --ignore-scripts

      - name: Publish with npm trusted publishing
        run: |
          VERSION="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          npm publish ./test/results/orvelt-business.tgz --access public --ignore-scripts --tag "$TAG"
