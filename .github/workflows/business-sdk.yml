name: 'Business SDK'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: 'Verify SDK & OpenAPI artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Business SDK
        run: bun run lint && bun run format:check && bun run check-generated && bun run typecheck && bun run test

      - name: Build publishable package
        run: bun run build

      - name: Pack npm-compatible artifact
        run: |
          mkdir -p test/results
          bun pm pack --ignore-scripts --filename "$PWD/test/results/orvelt-business.tgz"

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test the packed SDK
        run: bun run test-e2e

      - name: Save the verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-sdk-package
          path: test/results/orvelt-business.tgz
          if-no-files-found: error

      - name: Save browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-sdk-verification
          path: |
            test/results/playwright
            test/report

  publish:
    name: 'Publish @orvelt/business to npm'
    needs: [verify, consumer-compatibility, consumer-package-managers, consumer-bun-compatibility]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require the standalone main branch
        run: test "$GITHUB_REF" = refs/heads/main

      # Publish the exact tarball that passed verification, without rebuilding it.
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: business-sdk-package
          path: test/results

      - name: Inspect package contents
        run: npm pack ./test/results/orvelt-business.tgz --dry-run --ignore-scripts

      - name: Publish with npm trusted publishing
        run: |
          VERSION="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          npm publish ./test/results/orvelt-business.tgz --access public --ignore-scripts --tag "$TAG"

  consumer-compatibility:
    name: 'Consumer runtime (Node ${{ matrix.node-version }})'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Keep Bun contributor tooling separate from the consumer runtime matrix.
        node-version: ['20.19.0', '22', '24', '25', '26']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: business-sdk-package
          path: test/results

      - name: Install and test the tarball in an isolated npm consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          printf '{"private":true,"type":"module"}\n' > "$consumer/package.json"
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE/test/results/orvelt-business.tgz" --prefix "$consumer"
          cp test/support/consumer-runtime.mjs "$consumer/consumer-runtime.mjs"
          node "$consumer/consumer-runtime.mjs"

  consumer-package-managers:
    name: 'Consumer package manager (${{ matrix.package-manager }})'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn-classic, yarn-modern, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: business-sdk-package
          path: test/results

      - name: Install tarball with package manager
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          printf '{"private":true,"type":"module"}\n' > "$consumer/package.json"
          tarball="$GITHUB_WORKSPACE/test/results/orvelt-business.tgz"
          case "$PACKAGE_MANAGER" in
            npm) npm install --ignore-scripts --no-audit --no-fund "$tarball" --prefix "$consumer" ;;
            pnpm) npm exec --yes --package=pnpm@10.32.0 -- pnpm --dir "$consumer" add --ignore-scripts "$tarball" ;;
            yarn-classic) npm exec --yes --package=yarn@1.22.22 -- yarn --cwd "$consumer" add --ignore-scripts "file:$tarball" ;;
            yarn-modern) npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn --cwd "$consumer" add "@orvelt/business@file:$tarball" ;;
            bun) (cd "$consumer" && bun add --no-save "$tarball") ;;
            *) echo "Unknown package manager: $PACKAGE_MANAGER" >&2; exit 1 ;;
          esac
          cp test/support/consumer-runtime.mjs "$consumer/consumer-runtime.mjs"
          printf '%s\n' "$consumer" > "$RUNNER_TEMP/sdk-consumer-directory"

      - name: Run real HTTP consumer test
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(cat "$RUNNER_TEMP/sdk-consumer-directory")"
          case "$PACKAGE_MANAGER" in
            yarn-modern) npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn --cwd "$consumer" node consumer-runtime.mjs ;;
            bun) (cd "$consumer" && bun consumer-runtime.mjs) ;;
            *) node "$consumer/consumer-runtime.mjs" ;;
          esac

  consumer-bun-compatibility:
    name: 'Consumer runtime (Bun ${{ matrix.bun-version }})'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.3', '1.3.5', '1.3.11', '1.4.0', '1.4.2', '1.4.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: business-sdk-package
          path: test/results

      - name: Install tarball in an isolated Bun consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          printf '{"private":true,"type":"module"}\n' > "$consumer/package.json"
          bun --cwd "$consumer" add --no-save "$GITHUB_WORKSPACE/test/results/orvelt-business.tgz"
          cp test/support/consumer-runtime.mjs "$consumer/consumer-runtime.mjs"
          bun "$consumer/consumer-runtime.mjs"
