project:
  title: 'Business SDK'
  description: 'Generated TypeScript SDK and curated OpenAPI document for external Business API clients.'

dependsOn:
  - business-contract
  - storefront-contract

tags:
  - testable

language: typescript
stack: backend

workspace:
  inheritedTasks:
    exclude:
      - env

toolchains:
  default: bun
  javascript:
    syncProjectWorkspaceDependencies: false
  # This publishable SDK has its own standalone TypeScript build, not workspace references.
  typescript: false

tasks:
  pack:
    description: 'Pack the SDK artifact used by browser checks and npm publishing.'
    script: mkdir -p test/results && proto run bun -- pm pack --ignore-scripts --filename "$PWD/test/results/orvelt-business.tgz"
    deps:
      - ~:build
    outputs:
      - test/results/orvelt-business.tgz
    options:
      cache: false
    toolchains: bun

  test-e2e:
    description: 'Install and exercise the packed SDK in a browser without workspace dependencies.'
    command: bun run test-e2e
    deps:
      - ~:pack
    options:
      mergeDeps: replace
      mergeArgs: replace
      cache: false
      envFile: null
    toolchains: bun

  typecheck:
    description: 'Check the standalone SDK without emitting declaration files into source.'
    command: tsc --noEmit --project tsconfig.json
    options:
      mergeArgs: replace
    toolchains: bun

  generate-spec:
    description: 'Generate the curated OpenAPI document.'
    command: bun run scripts/generate-openapi.ts
    inputs:
      - package.json
      - scripts/generate-openapi.ts
      - src/constants.ts
      - /packages/business-contract/src/**/*
      - /packages/storefront-contract/src/**/*
      - /packages/events/src/**/*
    outputs:
      - openapi.json
    options:
      cache: false
    toolchains: bun

  generate-sdk:
    description: 'Generate the Hey API SDK from the curated OpenAPI document.'
    command: node scripts/hey-api-runner.mjs --file openapi-ts.config.ts
    deps:
      - ~:generate-spec
    inputs:
      - openapi-ts.config.ts
      - openapi.json
      - scripts/hey-api-runner.mjs
      - scripts/hey-api-typescript-loader.mjs
      - scripts/typescript-legacy-shim.mjs
      - scripts/fix-generated-headers.ts
    outputs:
      - src/generated/**/*
    options:
      cache: false
    toolchains:
      - bun
      - node

  generate:
    description: 'Generate the curated OpenAPI document and Hey API SDK.'
    deps:
      - ~:generate-sdk
    inputs:
      - openapi-ts.config.ts
      - package.json
      - scripts/**/*
      - src/constants.ts
      - /packages/business-contract/src/**/*
      - /packages/storefront-contract/src/**/*
      - /packages/events/src/**/*
    outputs:
      - openapi.json
      - src/generated/**/*
    options:
      cache: false
    toolchains: bun

  check-generated:
    description: 'Verify the committed OpenAPI document and SDK are current.'
    command: bun run scripts/check-generated.ts
    inputs:
      - openapi-ts.config.ts
      - openapi.json
      - package.json
      - scripts/**/*
      - src/constants.ts
      - src/generated/**/*
      - /packages/storefront-contract/src/**/*
      - /packages/business-contract/src/**/*
      - /packages/events/src/**/*
    toolchains: bun

  build:
    description: 'Regenerate and compile the publishable ESM package.'
    # Run typechecking after generation, not as a parallel dependency while output is replaced.
    script: bun run typecheck && rm -rf dist && tsc --project tsconfig.build.json && bun scripts/build-browser.ts
    deps:
      - ~:generate
    inputs:
      - openapi-ts.config.ts
      - package.json
      - scripts/**/*
      - src/**/*
      - tsconfig.build.json
      - tsconfig.json
      - /packages/storefront-contract/src/**/*
      - /packages/business-contract/src/**/*
      - /packages/events/src/**/*
    outputs:
      - dist/**/*
      - openapi.json
      - src/generated/**/*
    options:
      cache: false
    toolchains: bun

layer: library
